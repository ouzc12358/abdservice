name: Deploy secure Worker

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  schedule:
    # Reconcile the checked-in GitHub source with Cloudflare every six hours.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Deploy checked-in source or refresh from cmliu/edgetunnel first'
        required: true
        default: upstream
        type: choice
        options: [upstream, checked-in]

concurrency:
  group: abdservice-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://abdservice-secure.fatdot.workers.dev

    steps:
      - name: Check out the GitHub source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned tooling
        run: npm ci --ignore-scripts

      - name: Require a healthy baseline before unattended deployment
        if: github.event_name == 'schedule'
        run: node scripts/smoke-public.mjs "$WORKER_URL"

      - name: Refresh the upstream engine
        id: upstream
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == 'upstream')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: cmliu/edgetunnel
          UPSTREAM_REF: main
        run: node scripts/fetch-upstream-worker.mjs

      - name: Run security unit tests
        run: npm test

      - name: Validate generated Worker types
        run: npm run types

      - name: Validate the Cloudflare bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Capture the current deployment for rollback
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > "$RUNNER_TEMP/deployments.json"
          previous_version="$(node --input-type=module -e "import fs from 'node:fs'; const rows=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const row=rows.at(-1); const version=row?.versions?.find(item => item.percentage === 100)?.version_id; if (!version) process.exit(1); process.stdout.write(version);" "$RUNNER_TEMP/deployments.json")"
          echo "version_id=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Deploy the checked-in Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
        run: >-
          npx wrangler deploy --config wrangler.jsonc --keep-vars
          --message "GitHub ${GITHUB_SHA:0:12}; upstream ${UPSTREAM_COMMIT:-checked-in}; ${GITHUB_EVENT_NAME}"

      - name: Verify public security headers
        run: node scripts/smoke-public.mjs "$WORKER_URL"

      - name: Roll back automatically if the public smoke check fails
        if: failure() && steps.deploy.outcome == 'success' && steps.previous.outputs.version_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler versions deploy
          "${{ steps.previous.outputs.version_id }}@100"
          --config wrangler.jsonc
          --yes
          --message "Automatic rollback after post-deploy smoke failure"
